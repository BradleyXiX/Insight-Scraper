version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: insight_scraper_postgres
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: foundry
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d foundry"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  api:
    build:
      context: ./services/api
      dockerfile: Dockerfile
    container_name: insight_scraper_api
    ports:
      - "8000:8000"
    shm_size: '1gb'
    init: true
    environment:
      - DATABASE_URL=postgresql://user:password@postgres:5432/foundry
      - ENVIRONMENT=development
      # Local-only auth bypass. Never set ENVIRONMENT=production with this flag.
      - DEV_BYPASS_AUTH=${DEV_BYPASS_AUTH:-true}
      - DEV_TENANT_ID=${DEV_TENANT_ID:-local_operator}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:3000}
      - CLERK_FRONTEND_API=${CLERK_FRONTEND_API:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET:-}
      - PYTHONUNBUFFERED=1
    volumes:
      - ./services/api/src:/app
    command: sh -c "python init_db.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    container_name: insight_scraper_dashboard
    profiles:
      - full
      - frontend
      - dashboard
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-http://localhost:8000}
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY:-}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY:-}
      - NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY=${NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY:-}
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY:-}
      - STRIPE_PRICE_ID=${STRIPE_PRICE_ID:-}
    depends_on:
      - api

volumes:
  postgres_data:
